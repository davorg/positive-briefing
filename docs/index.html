<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Positive Briefing</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="card">
      <header class="header">
        <h1>Positive Briefing</h1>
        <p class="strapline">A tiny sunrise reset: useful, hopeful, actionable.</p>
      </header>

      <section id="content" class="content" aria-live="polite">
        <p class="loading">Fetching today’s briefing…</p>
      </section>

      <footer class="footer">
        <span id="meta"></span>
        <span class="sep">•</span>
        <span>Background photo from Unsplash</span>
        <span class="sep">•</span>
        <span>Briefing generated daily</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
